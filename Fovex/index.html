<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fovex - Next-Gen RSVP Speed Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card: #0F0F12;
      --border: #222228;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --accent: #E5A93B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }
    .badge-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
      font-size: 36px;
      margin: 0 auto 24px;
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.3);
    }
    h1 {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    p.lead {
      font-size: 18px;
      color: var(--muted);
      max-width: 540px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    footer {
      position: absolute;
      bottom: 24px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="badge-icon">F</div>
  <h1>Fovex</h1>
  <p class="lead">Bilişsel Odak &amp; Yüksek Hızlı RSVP Okuyucu. PDF ve EPUB kütüphanenizi şifrelenmiş olarak cihazınızda tutun, odaklanarak 3 kat daha hızlı okuyun.</p>
  <div class="links">
    <a href="privacy.html" class="btn btn-secondary">Privacy Policy</a>
    <a href="support.html" class="btn btn-primary">Support &amp; FAQ</a>
  </div>
  <footer>&copy; 2026 Fovex. All rights reserved.</footer>
</body>
</html>
